<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>DPC</title>
  <!-- DPC logo. Drawn on a 640 grid and scaled to 1024. Flat colours, no fonts. -->
  <defs>
    <clipPath id="disc">
      <circle cx="320" cy="320" r="311"/>
    </clipPath>
    <path id="c" d="M577 288 C548 268 516 262 478 262 C380 262 309 330 309 420 C309 512 372 561 470 561 C515 561 547 546 563 522 L567 506 L556 468 C540 474 512 486 472 486 C430 486 401 452 401 411 C401 370 430 336 470 336 C510 336 538 343 556 353 Z"/>
  </defs>
  <g transform="scale(1.6)">
    <!-- colour fields -->
    <g clip-path="url(#disc)">
      <rect x="0" y="0" width="640" height="640" fill="#FE5115"/>
      <rect x="259" y="0" width="381" height="640" fill="#FEC901"/>
      <path fill="#0C2B61" d="M165 668 L185 612 C225 500 255 410 300 348 C354 274 480 262 640 262 L660 262 L660 660 Z"/>
    </g>
    <!-- rim -->
    <circle cx="320" cy="320" r="311" fill="none" stroke="#0A1B43" stroke-width="14"/>
    <!-- D -->
    <path fill="#000" fill-rule="evenodd" d="M68 171 H165 C225 171 262 215 262 280 V364 C262 430 225 473 165 473 H68 Z M133 233 V410 H150 C178 410 192 385 192 345 V300 C192 260 178 233 150 233 Z"/>
    <!-- P -->
    <path fill="#000" fill-rule="evenodd" d="M274 49 H400 C447 49 476 90 476 136 C476 182 447 223 400 223 H347 V303 H274 Z M347 103 V168 H378 C395 168 404 153 404 135.5 C404 118 395 103 378 103 Z"/>
    <!-- C: a white outline drawn under the black letter -->
    <use xlink:href="#c" href="#c" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
    <use xlink:href="#c" href="#c" fill="#000"/>
  </g>
</svg>
