[project]
name = "dpc-client-core"
version = "0.29.0"
description = ""
authors = [{name = "Mike Shevchenko", email = "legoogmiha@gmail.com"}]
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12,<4"
dependencies = [
    "ollama>=0.6.0,<0.7.0",
    "websockets>=11.0",
    "toml>=0.10.2,<0.11.0",
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.45.0",
    # The ceiling has to clear every interpreter requires-python allows: 0.5.2
    # builds through PyO3 0.20, which refuses anything above 3.12, so a 3.13
    # install of this project could not succeed with or without a Rust
    # toolchain. 0.14.0 ships a cp313 wheel — measured 2026-09-02.
    "tiktoken>=0.5.1,<0.15",
    "httpx>=0.27.0,<0.28.0",
    "aiortc>=1.6.0,<2.0.0",
    "certifi>=2024.0.0",
    "psutil>=5.9.0,<6.0.0",
    "Pillow>=10.0.0,<11.0.0",
    "transformers>=4.44.0,<5.0.0",
    "sentencepiece>=0.2.0,<0.3.0",
    "torch>=2.7.0,<3.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision>=0.22.0,<1.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "accelerate>=0.34.0,<1.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "librosa>=0.10.0,<1.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "soundfile>=0.12.0,<1.0.0",
    "sentence-transformers>=5.4.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "faiss-cpu>=1.8; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "python-telegram-bot>=21.0,<22.0",
    "google-genai>=1.0.0",
    "gigachat>=0.2.0",
    "dpc-protocol",
    "bm25s>=0.3.3",
    "ddgs>=9.14",
    "trafilatura>=1.12,<3.0",
    "stopwordsiso>=0.6",
    "discord.py>=2.7.0,<3.0.0",
    "keyring>=24.0",
    "cryptography>=50.0.0",
    # PDF text, page geometry and per-character font attribution for
    # read_document. One self-contained wheel bundling PDFium, no transitive
    # dependencies, BSD-3-Clause OR Apache-2.0 — the licence matters because
    # the client is GPL-3.0-or-later and pymupdf's AGPL would carry §13 into
    # every node. In the base set rather than an extra on purpose: an extra is
    # one more name to remember on every `uv sync`, and forgetting it here
    # takes document reading away silently.
    "pypdfium2>=5.0,<6.0",
]

[project.optional-dependencies]
dev = ["fastapi"]
mlx = [
    "mlx>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
browser = [
    "camoufox>=0.4.11",
    # Playwright 1.61 sends isMobile in Juggler setDefaultViewport, which the
    # Camoufox Firefox build rejects — pin <1.61 until a Windows build with the
    # upstream cap (daijro/camoufox#653, commit 195298d0) ships. See backlog
    # CAMOUFOX-PLAYWRIGHT-61-FIX.
    "playwright>=1.60,<1.61",
]
graph-ner = [
    "gliner>=0.2.20",
]
graph-grafeo = [
    "grafeo>=0.5.42",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
dpc-protocol = { path = "../../dpc-protocol", editable = true }
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
