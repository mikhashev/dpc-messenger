# The gate the project did not have: until this runs, every "green" in a report means
# "locally, on my toolchain, on the layer I touched". Deliberately minimal — one runner,
# the two suites that exist, no auto-merge and no release job.
# Backlog: NO-CI-SO-EVERY-GREEN-IS-A-LOCAL-CLAIM.

name: tests

on:
  push:
    branches: [main, dev]
    # A release is a claim about one commit, and the run that backs it should be
    # findable by the name of the tag rather than by knowing which branch push
    # happened to carry the same sha.
    tags: ['v*']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: dpc-client/core
    # Not ubuntu-latest: on 26.04 `playwright install chromium` refuses the OS below
    # Playwright 1.61, and pyproject.toml holds playwright <1.61 for Camoufox. 24.04
    # also gives Python 3.12, what the nodes run. Back to latest when that pin lifts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the long-tier eval golds are pinned to GOLD_COMMIT and their
      # tests `git archive` that commit, which a depth-1 clone does not hold
      # ("fatal: not a tree object"). Red on every dev push from 2026-10-18 until this.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Extras rather than skip-if-missing: 31 of the 35 failures on 2026-08-27
      # were these packages missing, and a skip would hide 31 tests that run
      # here perfectly well. camoufox's Firefox build is not fetched: no test
      # here launches it. mlx stays out — Apple Silicon only.
      #
      # This stays a hand-written list where the release form is `--all-extras`,
      # and the difference is the point: the release describes a whole
      # environment, this job installs only the extras whose tests exist here.
      # `graph-grafeo` is declared again since 2026-11-07, pinned to
      # `grafeo==0.5.42` (Mike's call). This job still does not install it, so
      # the grafeo parity tests keep skipping here through `pytest.importorskip`.
      #
      # CPU build of torch, CI only. pyproject.toml pins torch to the CUDA 12.8
      # index so a user's `uv sync` gets the GPU build; the tests never touch a
      # GPU, and that build drags in ~4.7 GB of nvidia-* wheels (venv ~6.5 GB,
      # ~1.8 GB with the CPU build). So this job points the same named index at
      # the CPU wheels in its own checkout (pyproject.toml and uv.lock are
      # edited here and never committed; user installs are unchanged) and holds
      # torch at the version uv.lock already pins, so the tested torch does not
      # drift. Every other package keeps its locked version. A command-line
      # `--index` override does not work instead: it drops `explicit`, and uv
      # then resolves certifi etc. from the PyTorch index.
      - name: Sync (with the extras whose tests exist here)
        working-directory: dpc-client/core
        run: |
          sed -i 's#download.pytorch.org/whl/cu128#download.pytorch.org/whl/cpu#' pyproject.toml
          grep -q 'download.pytorch.org/whl/cpu' pyproject.toml
          python3 - <<'PY'
          import tomllib
          lock = tomllib.load(open("uv.lock", "rb"))
          pins = {p["version"].split("+")[0] for p in lock["package"]
                  if p["name"] == "torch" and "download.pytorch.org" in p["source"].get("registry", "")}
          assert len(pins) == 1, pins
          open("/tmp/torch-constraint.txt", "w").write("torch==%s\n" % pins.pop())
          PY
          cat /tmp/torch-constraint.txt
          uv sync --upgrade-package "$(cat /tmp/torch-constraint.txt)" --extra browser --extra pdf --extra voice-memory
          # The re-locked uv.lock now lives only in this workspace. Later `uv run`
          # steps must not re-resolve (it would drop the torch constraint).
          echo UV_FROZEN=1 >> "$GITHUB_ENV"
      # The extra brings the playwright package and no browser. The snapshot
      # secret-field tests run the real walk in Chromium and skip cleanly
      # without a binary — which here would mean ~60 skips under a green run,
      # and a leak guard that exists only on a developer's machine.
      - name: Chromium for the tests that run the snapshot walk
        working-directory: dpc-client/core
        run: uv run playwright install --with-deps chromium
      # Baseline measured on Windows 2026-08-20: 4 failed · 2086 passed · 3 skipped (160s).
      # They were deselected by name, not hidden by a bare `|| true`, and each one has a
      # backlog entry (CI-BASELINE-FOUR-TESTS-FAIL-BEFORE-THE-FIRST-RUN). One remains: the two
      # web-audit tests were renamed on 2026-09-11 and their lines matched nothing, so they
      # were removed on 2026-09-28; test_bootstrap_partial_failure was a real bootstrap
      # defect, fixed and un-deselected in 9b07645d on 2026-09-30. A gate that is red
      # for reasons unrelated to the change teaches everyone to ignore it; a silent skip
      # teaches that the suite is green. Neither — name them here and delete lines as they fix.
      - name: Pytest
        working-directory: dpc-client/core
        run: >
          uv run python -m pytest -q
          --deselect tests/test_turn.py::test_turn_connectivity

  protocol:
    name: dpc-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        working-directory: dpc-protocol
        run: uv sync
      # dpc-protocol declares no test dependency at all, so a bare `uv sync` leaves its six
      # test files unrunnable. `--with pytest` supplies it for the run instead of editing a
      # shared package's pyproject.toml from CI's side; move it into a dev group there when
      # someone touches that file for its own reasons.
      - name: Pytest
        working-directory: dpc-protocol
        run: uv run --with pytest python -m pytest -q
