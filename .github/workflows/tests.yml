# The gate the project did not have: until this runs, every "green" in a report means
# "locally, on my toolchain, on the layer I touched". Deliberately minimal — one runner,
# the two suites that exist, no auto-merge and no release job.
# Backlog: NO-CI-SO-EVERY-GREEN-IS-A-LOCAL-CLAIM.

name: tests

on:
  push:
    branches: [main, dev]
    # A release is a claim about one commit, and the run that backs it should be
    # findable by the name of the tag rather than by knowing which branch push
    # happened to carry the same sha.
    tags: ['v*']
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: dpc-client/core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Extras rather than skip-if-missing: 31 of the 35 failures on 2026-08-27
      # were these packages missing, and a skip would hide 31 tests that run
      # here perfectly well. camoufox's Firefox build is not fetched: no test
      # here launches it. mlx stays out — Apple Silicon only.
      #
      # This stays a hand-written list where the release form is `--all-extras`,
      # and the difference is the point: the release describes a whole
      # environment, this job installs only the extras whose tests exist here.
      # `graph-grafeo` was on this line until 2026-09-18 and is gone from
      # `pyproject.toml` (Mike's call) — an undefined extra is not ignored, uv
      # refuses with "Extra `X` is not defined", so the removal had to land in
      # the same commit or this job would have failed on the next push. The
      # grafeo parity tests now skip themselves through `pytest.importorskip`.
      - name: Sync (with the extras whose tests exist here)
        working-directory: dpc-client/core
        run: uv sync --extra browser --extra pdf
      # The extra brings the playwright package and no browser. The snapshot
      # secret-field tests run the real walk in Chromium and skip cleanly
      # without a binary — which here would mean ~60 skips under a green run,
      # and a leak guard that exists only on a developer's machine.
      - name: Chromium for the tests that run the snapshot walk
        working-directory: dpc-client/core
        run: uv run playwright install --with-deps chromium
      # Baseline measured on Windows 2026-08-20: 4 failed · 2086 passed · 3 skipped (160s).
      # The four are deselected by name, not hidden by a bare `|| true`, and each one has a
      # backlog entry (CI-BASELINE-FOUR-TESTS-FAIL-BEFORE-THE-FIRST-RUN). A gate that is red
      # for reasons unrelated to the change teaches everyone to ignore it; a silent skip
      # teaches that the suite is green. Neither — name them here and delete lines as they fix.
      - name: Pytest
        working-directory: dpc-client/core
        run: >
          uv run python -m pytest -q
          --deselect tests/dht/test_manager.py::test_bootstrap_partial_failure
          --deselect tests/test_turn.py::test_turn_connectivity
          --deselect tests/test_web_audit.py::test_browse_page_audit_on_firewall_denied
          --deselect tests/test_web_audit.py::test_browse_page_audit_on_auth_required

  protocol:
    name: dpc-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        working-directory: dpc-protocol
        run: uv sync
      # dpc-protocol declares no test dependency at all, so a bare `uv sync` leaves its six
      # test files unrunnable. `--with pytest` supplies it for the run instead of editing a
      # shared package's pyproject.toml from CI's side; move it into a dev group there when
      # someone touches that file for its own reasons.
      - name: Pytest
        working-directory: dpc-protocol
        run: uv run --with pytest python -m pytest -q
